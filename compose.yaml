services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gestor
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  gestor_pgdata:
